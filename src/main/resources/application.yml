spring:
  profiles:
    active: dev

  application:
    name: shortlink

  datasource:
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      repositories:
        enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  jwt:
    access-token-expiration: 900000
    refresh-token-expiration: 2592000000

  cookie:
    path: /api/auth
    same-site: Strict

  redis:
    ttl-seconds: 86400
