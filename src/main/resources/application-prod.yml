server:
  port: ${PORT:8080}

spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

  data:
    redis:
      url: ${REDIS_URL}

  mail:
    host: ${MAIL_HOST:smtp-relay.brevo.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  base-url: ${APP_BASE_URL:${BASE_URL:http://localhost:8080}}

  jwt:
    secret: ${JWT_SECRET}

  cookie:
    same-site: ${COOKIE_SAME_SITE:None}
    secure: ${COOKIE_SECURE:true}

  frontend:
    url: ${FRONTEND_URL:http://localhost:3000}

