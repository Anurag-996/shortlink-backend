server:
  port: ${PORT:8080}

spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

  data:
    redis:
      url: ${REDIS_URL}

app:
  base-url: ${APP_BASE_URL:${BASE_URL:http://localhost:8080}}

  jwt:
    secret: ${JWT_SECRET}

  cookie:
    secure: true

  frontend:
    url: ${FRONTEND_URL:http://localhost:3000}
